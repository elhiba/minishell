name: MINISHELL_TESTER

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: sudo apt update; sudo apt install -y build-essential libreadline8 libreadline-dev valgrind

      - name: Compile
        run: make

      - name: Run program
        run: ./minishell < inputs.txt

      - name: Run with valgrind
        run: valgrind --leak-check=full --show-leak-kinds=all --track-fds=yes --suppressions=readline.supp -q ./minishell < inputs.txt
